# Rebuilds + republishes this static site when BetterCMS content is published
# (repository_dispatch: bcms-rebuild) and on push to main.
#
# Build settings come from BCMS_* repository variables (set from the BetterCMS
# Hosting page), never from this file — so changing them does not touch your repo.
name: BetterCMS Rebuild

on:
  repository_dispatch:
    types: [bcms-rebuild]
  push:
    branches: [main]

# Read-only: this workflow only ever checks out the repo and uploads a build
# artifact to BetterCMS. It must never be able to write back to the repository —
# the build command is operator-configurable from the BetterCMS dashboard, and a
# workspace admin there is not necessarily a collaborator here.
permissions:
  contents: read

jobs:
  build-and-publish:
    # "Auto deploy on push" (BCMS_AUTO_DEPLOY repo variable). Off ⇒ a git push no
    # longer deploys, but a CMS publish (repository_dispatch) still rebuilds. That
    # is exactly what the toggle promises on the Hosting page.
    if: github.event_name != 'push' || vars.BCMS_AUTO_DEPLOY != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (push → its commit; content rebuild → main HEAD)
        uses: actions/checkout@v4
        with:
          # A push builds its own commit. A content rebuild (repository_dispatch)
          # builds the latest main: the dispatched value is a content marker,
          # not a git ref, so pinning checkout to it 404s the fetch.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Start build timer
        run: echo "BCMS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node version is a per-project setting (BCMS_NODE_VERSION). Unset ⇒ 22:
          # current LTS, and modern frameworks (Astro 6, Vite 8) require >=22.12
          # while 22 stays backward-compatible with older projects.
          node-version: ${{ vars.BCMS_NODE_VERSION || '22' }}
          # No 'cache:' here — it would hard-require a package-lock.json/yarn.lock and
          # fail any bun/pnpm project. Each package manager handles its own caching.

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch CMS content (build-time injection)
        env:
          API_URL: https://api.bettercms.ai
          API_KEY: ${{ secrets.BCMS_API_KEY }}
          WORKSPACE: ${{ vars.BCMS_WORKSPACE_SLUG }}
          ENVIRONMENT: production
          CONTENT_OUT: bcms-content.json
          ROOT_DIR: ${{ vars.BCMS_ROOT_DIR }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/bcms-build.log") 2>&1
          # CONTENT_OUT is relative, and the build runs in ROOT_DIR — so the content
          # file has to be written there too, or a content-consuming build won't find it.
          if [ -n "${ROOT_DIR:-}" ] && [ "${ROOT_DIR}" != "/" ] && [ "${ROOT_DIR}" != "." ]; then
            cd "$ROOT_DIR" || { echo "::error::configured root directory '$ROOT_DIR' not found"; exit 1; }
          fi
          curl -fsSL "$API_URL/action/fetch-content.mjs" -o "$RUNNER_TEMP/fetch-content.mjs"
          node "$RUNNER_TEMP/fetch-content.mjs"

      - name: Export project environment variables
        env:
          # The project's own env vars (FLO-983) are written to this repo as encrypted
          # repository SECRETS by syncProjectEnvVars. GitHub hands a secret to a step only
          # if that step names it in `env:` — and this template is a pure function of the
          # branch, so it cannot know per-project key names. `toJSON(secrets)` is the only
          # channel that carries them without templating user input into YAML.
          #
          # Its own step on purpose: values written to $GITHUB_ENV apply to SUBSEQUENT
          # steps, never the one doing the writing. Folded into "Install & build" this
          # would run, succeed, and silently export nothing that build could see.
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          node -e '
            var fs = require("fs");
            var secrets = JSON.parse(process.env.SECRETS_CONTEXT || "{}");
            // BCMS_* are platform-internal (the delivery API key above all); GITHUB_TOKEN
            // and ACTIONS_* belong to the runner. syncProjectEnvVars already refuses to
            // WRITE a BCMS_ key, so this is the symmetric guard on the read side.
            var skip = function (k) { return /^BCMS_/i.test(k) || /^(github_token|ACTIONS_)/i.test(k); };
            var DELIM = "BCMS_ENV_EOF";
            var out = [];
            Object.keys(secrets).forEach(function (key) {
              var value = secrets[key];
              if (skip(key) || typeof value !== "string") return;
              // A value containing the heredoc terminator could close it early and turn
              // the remainder into forged entries. Drop it loudly rather than write a
              // $GITHUB_ENV file that means something other than what was configured.
              if (value.indexOf(DELIM) !== -1) {
                console.log("::warning::skipped " + key + " - value contains the reserved delimiter");
                return;
              }
              out.push(key + "<<" + DELIM + "\n" + value + "\n" + DELIM);
              console.log("exported " + key);
            });
            if (out.length) fs.appendFileSync(process.env.GITHUB_ENV, out.join("\n") + "\n");
            console.log("project environment variables exported: " + out.length);
          '

      - name: Install & build
        env:
          # Per-project overrides. Passed as env, never inlined into the script body.
          # Empty ⇒ the lockfile auto-detection below runs exactly as it always has.
          ROOT_DIR: ${{ vars.BCMS_ROOT_DIR }}
          INSTALL_CMD: ${{ vars.BCMS_INSTALL_COMMAND }}
          # Empty => lockfile detection runs unchanged. CHECK-constrained at the DB and
          # enum-validated at the API, because it is expanded into the shell below.
          PKG_MANAGER: ${{ vars.BCMS_PKG_MANAGER }}
          BUILD_CMD: ${{ vars.BCMS_BUILD_COMMAND }}
          # ── SDK configuration ───────────────────────────────────────────────────
          # @bettercms-ai/astro reads these in its astro:config:setup hook and THROWS
          # without them. The fetch step above already receives the same workspace slug;
          # the build did not, so every repo that called `bettercms({})` — the form the
          # README documents — died before rendering a single page. The Next/React SDKs
          # read the same names.
          #
          # PUBLIC_-prefixed because that is Vite's (and therefore Astro's) default
          # envPrefix: these three reach `import.meta.env.PUBLIC_BCMS_*` in client code.
          # All three are already public — the workspace slug and project id appear in
          # every delivery URL the browser calls. The API KEY is deliberately absent.
          PUBLIC_BCMS_API_URL: https://api.bettercms.ai
          PUBLIC_BCMS_WORKSPACE: ${{ vars.BCMS_WORKSPACE_SLUG }}
          PUBLIC_BCMS_PROJECT_ID: ${{ vars.BCMS_PROJECT_ID }}
          # Absolute origin for canonical + og:url. Unset (a repo connected before this
          # variable existed) ⇒ a site that omits those tags, exactly as before.
          PUBLIC_SITE_URL: ${{ vars.BCMS_SITE_URL }}
        run: |
          # Mirror everything to a log file so the failure reporter below can send the
          # tail back to BetterCMS. Without this a broken build is only visible here.
          exec > >(tee -a "$RUNNER_TEMP/bcms-build.log") 2>&1
          # Root directory (Vercel "Root Directory"): the sub-dir of a monorepo that
          # holds the site. Empty ⇒ repo root. Validated server-side (no .., no
          # absolute paths) before it is ever written as a variable.
          if [ -n "${ROOT_DIR:-}" ] && [ "${ROOT_DIR}" != "/" ] && [ "${ROOT_DIR}" != "." ]; then
            echo "root directory: $ROOT_DIR"
            cd "$ROOT_DIR" || { echo "::error::configured root directory '$ROOT_DIR' not found"; exit 1; }
          fi
          # BetterCMS package-manager setup — sourced before every dependency install.
          # Embedded into the generated GitHub workflows (helpers.ts) and sourced by build.sh.
          # pnpm takes its major from pnpm-lock.yaml, as Vercel does: Corepack otherwise fetches
          # the newest pnpm, which refuses a lockfile an older major wrote (ERR_PNPM_BROKEN_LOCKFILE).
          # A packageManager field in package.json names the exact version, and Corepack honors it.
          corepack enable || true
          if [ -f pnpm-lock.yaml ] && ! grep -q '"packageManager"' package.json 2>/dev/null; then
            BCMS_PNPM_LOCKFILE="$(grep -m1 '^lockfileVersion' pnpm-lock.yaml | tr -dc '0-9.' || true)"
            case "$BCMS_PNPM_LOCKFILE" in
              5.[0-3]*) BCMS_PNPM=6 ;;
              5.4*) BCMS_PNPM=7 ;;
              6.*) BCMS_PNPM=8 ;;
              9.*) BCMS_PNPM=9 ;;
              *) BCMS_PNPM="" ;;
            esac
            if [ -n "$BCMS_PNPM" ]; then
              echo "pnpm-lock.yaml is lockfileVersion $BCMS_PNPM_LOCKFILE: using pnpm $BCMS_PNPM"
              # Never fatal: a pin that cannot be fetched leaves the default pnpm, as before this file.
              corepack install -g "pnpm@$BCMS_PNPM" || npm install -g --force "pnpm@$BCMS_PNPM" \
                || echo "::warning::could not install pnpm $BCMS_PNPM; continuing with the default pnpm"
            fi
          fi

          # Install and build are INDEPENDENT phases, each overridable on its own —
          # Vercel semantics. Overriding only the install command (the common case,
          # e.g. "npm install --legacy-peer-deps") must NOT stop the build from running.
          # A repo with no package.json — or no "build" script — is a plain static site:
          # skip both phases and publish the files as-is (Vercel "Other" preset).
          PM=""
          if [ -f package.json ]; then
            # An explicit override wins over detection (FLO-977). Detection is a GUESS the
            # moment a repo carries two lockfiles — an ordinary state right after migrating
            # between managers — and the loser is a build that dies at install with no
            # explanation. Empty ⇒ detect exactly as before, which is every project today.
            if [ -n "$PKG_MANAGER" ]; then PM="$PKG_MANAGER"
            elif [ -f bun.lock ] || [ -f bun.lockb ]; then PM="bun"
            elif [ -f pnpm-lock.yaml ]; then PM="pnpm"
            elif [ -f yarn.lock ]; then PM="yarn"
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then PM="npm"
            else PM="npm-nolock"
            fi
          fi
          HAS_BUILD_SCRIPT=0
          if [ -f package.json ] && node -e "process.exit((require('./package.json').scripts||{}).build?0:1)" 2>/dev/null; then
            HAS_BUILD_SCRIPT=1
          fi

          # Fail here, not 100 lines later. A repo with no build script AND no HTML anywhere
          # cannot produce a site: install is skipped, build is skipped, and the packaging
          # step below dies with "no static HTML found" — which reads as a broken static
          # export and sends people to fix a next.config that was never the problem. The
          # actual situation is that the repository is empty, and that deserves its own
          # sentence. (An explicit BUILD_CMD means the user knows better; let them run it.)
          if [ "$HAS_BUILD_SCRIPT" = "0" ] && [ -z "${BUILD_CMD:-}" ] \
             && [ -z "$(find . -path ./node_modules -prune -o -name '*.html' -print -quit 2>/dev/null)" ]; then
            echo "::error::this repository has no website in it — no \"build\" script in package.json (or no package.json at all) and no HTML files. Push your site's source, or create this project's repository from a starter template on the Hosting page."
            exit 1
          fi
          # Nothing to install or build unless a build actually happens: either the repo
          # declares a build script, or an explicit build command was configured.
          WILL_BUILD=0
          if [ "$HAS_BUILD_SCRIPT" = "1" ] || [ -n "${BUILD_CMD:-}" ]; then WILL_BUILD=1; fi

          # ── Install ──
          # An explicit command is a shell command by definition — that IS the setting —
          # which is why this workflow pins `permissions: contents: read` above.
          if [ -n "${INSTALL_CMD:-}" ]; then
            echo "install command: $INSTALL_CMD"
            sh -c "$INSTALL_CMD"
          elif [ -z "$PM" ]; then
            echo "No package.json — treating the repo as a static site (no install step)."
          elif [ "$WILL_BUILD" = "0" ]; then
            echo "No \"build\" script in package.json — treating the repo as a static site (no install step)."
          else
            case "$PM" in
              bun)        echo "Detected Bun (bun.lock)";           bun install ;;
              pnpm)       echo "Detected pnpm (pnpm-lock.yaml)";    pnpm install || pnpm install --no-frozen-lockfile ;;
              yarn)       echo "Detected Yarn (yarn.lock)";         yarn install ;;
              npm)        echo "Detected npm (lockfile)";           npm ci || npm install ;;
              npm-nolock) echo "No lockfile detected — falling back to npm install"; npm install ;;
            esac
          fi

          # ── Build ──
          if [ -n "${BUILD_CMD:-}" ]; then
            echo "build command: $BUILD_CMD"
            sh -c "$BUILD_CMD"
          elif [ -z "$PM" ] || [ "$WILL_BUILD" = "0" ]; then
            echo "Nothing to build — publishing the repo's static files as-is."
          else
            case "$PM" in
              bun)  bun run build ;;
              pnpm) pnpm run build ;;
              yarn) yarn build ;;
              *)    npm run build ;;
            esac
          fi

      - name: Package, checksum & upload artifact
        env:
          API_URL: https://api.bettercms.ai
          API_KEY: ${{ secrets.BCMS_API_KEY }}
          PROJECT_ID: ${{ vars.BCMS_PROJECT_ID }}
          # Optional escape hatch (Vercel "Output Directory" setting). Set the
          # BCMS_BUILD_DIR repo variable to force a dir; unset → auto-detect below.
          BUILD_DIR_OVERRIDE: ${{ vars.BCMS_BUILD_DIR }}
          ROOT_DIR: ${{ vars.BCMS_ROOT_DIR }}
          # Provenance for the BetterCMS deploy history. RUN_ID is the only real
          # build log we have — the platform links back to this Actions run.
          BRANCH: main
          AUTHOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/bcms-build.log") 2>&1
          if [ -n "${ROOT_DIR:-}" ] && [ "${ROOT_DIR}" != "/" ] && [ "${ROOT_DIR}" != "." ]; then
            cd "$ROOT_DIR"
          fi
          node - "$RUNNER_TEMP/bcms-design-system.json" <<'BCMS_DESIGN_SCRIPT'
          /* Runs ONLY in the customer's build sandbox/CI, never in the API process. */
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");
          const root = process.cwd();
          const output = process.argv[2];
          const requireProject = createRequire(path.join(root, "package.json"));
          const manifest = { format: 1, complete: true, compilerResolved: false, framework: "css", tokens: [], capabilities: [], css: [], warnings: [] };
          const ignored = new Set(["node_modules", ".git", ".next", ".nuxt", "dist", "build", "out", ".output", ".cache", "coverage"]);
          let visited = 0, bytes = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true }).sort((a,b) => a.name.localeCompare(b.name))) {
              if (++visited > 20000) throw new Error("Source scan limit exceeded");
              const file = path.join(dir, entry.name);
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory() && !ignored.has(entry.name) && !entry.name.startsWith(".")) walk(file);
              if (entry.isFile() && entry.name.endsWith(".css")) {
                const size = fs.statSync(file).size;
                bytes += size;
                if (size > 2000000 || bytes > 8000000 || manifest.css.length >= 80) throw new Error("Source CSS budget exceeded");
                manifest.css.push({ path: path.relative(root, file), text: fs.readFileSync(file, "utf8") });
              }
            }
          }
          function flatten(value, name, source, defaults) {
            if (typeof value === "function" || value == null) return;
            if (typeof value === "object" && !Array.isArray(value)) {
              for (const [key, child] of Object.entries(value)) flatten(child, key === "DEFAULT" ? name : `${name}-${key}`, source, defaults && defaults[key]);
              return;
            }
            const text = Array.isArray(value) ? (value.some(v => typeof v === "object") ? JSON.stringify(value) : value.join(", ")) : String(value);
            if (text.length > 4000 || manifest.tokens.length >= 4000) throw new Error("Theme token limit exceeded");
            manifest.tokens.push({ name, value: text, scope: ":root", origin: JSON.stringify(value) === JSON.stringify(defaults) ? "default" : "config", source });
          }
          (async () => { try {
            walk(root);
            let pkg;
            try { pkg = requireProject("tailwindcss/package.json"); } catch {}
            if (pkg) {
              manifest.framework = `tailwind@${pkg.version}`;
              if (pkg.version.startsWith("3.")) {
                const config = ["tailwind.config.js", "tailwind.config.cjs", "tailwind.config.mjs", "tailwind.config.ts"].find(f => fs.existsSync(path.join(root, f)));
                const load = requireProject("tailwindcss/loadConfig");
                const resolve = requireProject("tailwindcss/resolveConfig");
                const loaded = config ? (load.default || load)(path.join(root, config)) : {};
                const theme = (resolve.default || resolve)(loaded).theme;
                const defaults = (resolve.default || resolve)({}).theme;
                const groups = { colors: "color", fontFamily: "font", fontSize: "text", spacing: "spacing", borderRadius: "radius", boxShadow: "shadow", screens: "breakpoint", transitionDuration: "duration", transitionTimingFunction: "ease", animation: "animate", keyframes: "keyframes" };
                for (const [key, prefix] of Object.entries(groups)) flatten(theme[key], `--${prefix}`, config || "tailwind-defaults", defaults[key]);
                manifest.compilerResolved = true;
                manifest.css = [];
              } else if (pkg.version.startsWith("4.")) {
                const loader = requireProject("@tailwindcss/node").__unstable__loadDesignSystem;
                if (typeof loader !== "function") throw new Error("Tailwind compiler API unavailable");
                const entries = manifest.css.filter(sheet => /@import\s+["']tailwindcss(?:\/[^"']*)?["']/.test(sheet.text));
                if (entries.length !== 1) throw new Error("A single Tailwind CSS entrypoint is required for full source coverage");
                const entry = entries[0];
                const design = await loader(entry.text, { base: path.dirname(path.join(root, entry.path)) });
                for (const [name, token] of design.theme.entries()) {
                  if (manifest.tokens.length >= 4000) throw new Error("Theme token limit exceeded");
                  manifest.tokens.push({ name, value: token.value, scope: ":root", origin: (token.options & 4) ? "default" : "theme", source: entry.path });
                }
                // Keep compiler semantics even when an unused inline/static token emits no CSS.
                for (const [name, token] of design.theme.entries()) {
                  if (token.options & 3) manifest.capabilities.push({ name: `@theme ${name}`, scope: ":root", value: JSON.stringify({ inline: !!(token.options & 1), reference: !!(token.options & 2), static: !!(token.options & 8) }) });
                  else if (token.options & 8) manifest.capabilities.push({ name: `@theme ${name}`, scope: ":root", value: JSON.stringify({ inline: false, reference: false, static: true }) });
                }
                const baseline = await loader('@import "tailwindcss";', { base: path.dirname(path.join(root, entry.path)) });
                // Query the real registries, including registrations loaded through imports/plugins.
                // Samples document compiler behavior; functional utilities are not claimed exhaustive.
                for (const [name, definitions] of design.utilities.utilities) {
                  const functional = definitions.some(definition => definition.kind === "functional");
                  const candidates = functional ? [`${name}-[1px]`, `${name}-[red]`, `${name}-1`] : [name];
                  const compiled = design.candidatesToCss(candidates);
                  if (baseline.utilities.utilities.has(name) && JSON.stringify(compiled) === JSON.stringify(baseline.candidatesToCss(candidates))) continue;
                  manifest.capabilities.push({ name: `@utility ${name}${functional ? "-*" : ""}`, scope: ":root", value: JSON.stringify({ kind: functional ? "functional" : "static", samples: candidates.map((candidate, i) => ({ candidate, css: compiled[i] })) }) });
                }
                for (const [name, definition] of design.variants.variants) {
                  const candidates = [`${name}:block`];
                  const compiled = design.candidatesToCss(candidates);
                  if (baseline.variants.variants.has(name) && JSON.stringify(compiled) === JSON.stringify(baseline.candidatesToCss(candidates))) continue;
                  manifest.capabilities.push({ name: `@custom-variant ${name}`, scope: ":root", value: JSON.stringify({ kind: definition.kind, samples: compiled }) });
                }
                if (manifest.capabilities.length > 2000 || manifest.capabilities.some(capability => capability.value.length > 4000)) throw new Error("Theme capability limit exceeded");
                manifest.compilerResolved = true;
                // The real compiler resolved imports/config/plugins. Raw unrelated source files must
                // never be merged over its result; emitted CSS supplies selectors/modes/used utilities.
                manifest.css = [];
              }
            }
            if (!manifest.compilerResolved) { manifest.css = []; manifest.warnings.push("Source compiler unavailable; compiled styles only"); }
            fs.writeFileSync(output, JSON.stringify(manifest));
          } catch (error) {
            // Explicit incomplete envelope prevents a partial snapshot from deleting last-good tokens.
            fs.writeFileSync(output, JSON.stringify({ ...manifest, complete: false, warnings: [String(error.message).slice(0,500)] }));
            console.error(`Design extraction incomplete: ${error.message}`);
          }
          })();
          BCMS_DESIGN_SCRIPT
          # Label the artifact with the commit we actually built, so the platform
          # always records a real git SHA — a content rebuild's dispatched marker
          # isn't a commit. This self-heals what the next rebuild can reference.
          SHA="$(git rev-parse HEAD)"
          # Resolve the static build output to package. An explicit override wins;
          # otherwise scan the conventional output dirs of the common static
          # generators (Vite/Astro/Vue → dist, CRA/SvelteKit-static/Docusaurus →
          # build, Next export → out, Gatsby/Hugo/VuePress → public, Eleventy/Jekyll
          # → _site, Nuxt 3 → .output/public), preferring one with an index.html.
          CANDIDATES="dist build out public _site .output/public"
          BUILD_DIR=""
          if [ -n "${BUILD_DIR_OVERRIDE:-}" ]; then
            BUILD_DIR="$BUILD_DIR_OVERRIDE"
            if [ ! -d "$BUILD_DIR" ]; then
              echo "::error::configured BCMS_BUILD_DIR '$BUILD_DIR' not found after build"; exit 1
            fi
          else
            for d in $CANDIDATES; do
              if [ -d "$d" ] && [ -f "$d/index.html" ]; then BUILD_DIR="$d"; break; fi
            done
            # No root index.html? Fall back to the first candidate that contains ANY
            # .html file (multi-page exports without a root index.html). A dir with
            # assets but no HTML — e.g. a Next.js public/ when the app was NOT statically
            # exported — is not a site, so it's skipped and we fail loud below rather
            # than publishing a 403 directory with no index.
            if [ -z "$BUILD_DIR" ]; then
              for d in $CANDIDATES; do
                if [ -d "$d" ] && [ -n "$(find "$d" -maxdepth 2 -name '*.html' -print -quit 2>/dev/null)" ]; then BUILD_DIR="$d"; break; fi
              done
            fi
          fi
          # Static site whose output IS the repo root (plain HTML, no build step).
          if [ -z "$BUILD_DIR" ] && [ -n "$(find . -maxdepth 1 -name '*.html' -print -quit 2>/dev/null)" ]; then
            echo "no build output dir — packaging the repo root as a static site"
            BUILD_DIR="."
          fi
          # bcms:ssr-guard:start
          # An Astro SERVER build is never a static site, however its directory was chosen. Its
          # output is dist/client + dist/server with no index.html at the root, so served as files
          # every route answers 404 while the build, the release and the deploy all read green.
          # Two ways here picked it anyway: BCMS_BUILD_DIR=dist (which skipped the server check
          # below), and a server build that prerenders a page, whose dist/client/*.html satisfied
          # the any-HTML fallback. Chosen by the scan → hand it to the server branch. Chosen by
          # the override → the customer asked for exactly this, so refuse it by name.
          if [ -n "$BUILD_DIR" ] && [ "$BUILD_DIR" != "." ] && [ -f dist/server/entry.mjs ] && [ ! -f "$BUILD_DIR/index.html" ]; then
            if [ -n "${BUILD_DIR_OVERRIDE:-}" ]; then
              echo "::error::STATIC_HOST_GOT_SSR_ARTIFACT: BCMS_BUILD_DIR='$BUILD_DIR' holds an Astro server build (dist/server/entry.mjs) with no index.html at its root — served as a static site, every route would answer 404. Unset BCMS_BUILD_DIR so it is packaged as a server app, then switch this project to 'Run as a server app' on the Hosting page. Or build a static site (output: 'static')."; exit 1
            fi
            echo "::warning::dist holds an Astro server build — packaging it as a server app. It runs only once this project is set to Run as a server app on the Hosting page; until then only its prerendered pages and assets are served."
            BUILD_DIR=""
          fi
          # bcms:ssr-guard:end
          # ── Server runtime (FLO-947 Phase B) ───────────────────────────────────────
          # Reached only when every static path above came up empty, so a repo that
          # deploys today is packaged byte-identically. Opt-in is the customer's
          # next.config (output:"standalone"), which is the framework's own switch —
          # not a BetterCMS setting they would have to discover, and not auto-detection
          # of a plain "next build", which would silently change how their site is
          # hosted. A repo with no standalone output still gets the static error below.
          #
          # Layout: app/ is the runnable tree, _next/static + public/ are hard-linked to
          # the web root so nginx serves hashed assets off disk under its existing
          # 1y-immutable rule and the Node process never sees an asset request.
          if [ -z "$BUILD_DIR" ] && [ -f .next/standalone/server.js ]; then
            echo "detected a Next.js standalone server build — packaging as a runtime release"
            RT="$RUNNER_TEMP/bcms-runtime"
            rm -rf "$RT" && mkdir -p "$RT/app"
            cp -a .next/standalone/. "$RT/app/"
            if [ -d .next/static ]; then
              mkdir -p "$RT/_next" "$RT/app/.next"
              cp -al .next/static "$RT/_next/static" 2>/dev/null || cp -a .next/static "$RT/_next/static"
              cp -al .next/static "$RT/app/.next/static" 2>/dev/null || cp -a .next/static "$RT/app/.next/static"
            fi
            if [ -d public ]; then
              cp -al public/. "$RT/" 2>/dev/null || cp -a public/. "$RT/"
              mkdir -p "$RT/app/public"
              cp -al public/. "$RT/app/public/" 2>/dev/null || cp -a public/. "$RT/app/public/"
            fi
            printf '%s\n' '{"kind":"node","dir":"app","entry":"server.js"}' > "$RT/bcms-runtime.json"
            BUILD_DIR="$RT"
          elif [ -z "$BUILD_DIR" ] && [ -f dist/server/entry.mjs ]; then
            # Astro's node adapter in "standalone" mode. Same opt-in doctrine as above: this
            # file only exists when the customer set output:"server" + @astrojs/node, and every
            # static Astro build has already been picked up by the dist/index.html scan.
            echo "detected an Astro server build — packaging as a runtime release"
            RT="$RUNNER_TEMP/bcms-runtime"
            rm -rf "$RT" && mkdir -p "$RT/app"
            cp -a dist/. "$RT/app/"
            [ -f package.json ] && cp package.json "$RT/app/"
            # Astro does NOT bundle dependencies (a Next standalone build does), so without the
            # production node_modules the entrypoint is a file with nothing to require.
            if [ ! -d node_modules ]; then
              echo "::error::this Astro server build has no node_modules directory to ship. Astro does not bundle its dependencies, so a server app must install them to disk — Yarn Plug'n'Play (.pnp.cjs, no node_modules) is not supported for 'Run as a server app'. Set nodeLinker: node-modules in .yarnrc.yml, or export a static site instead."; exit 1
            fi
            # Prune per LOCKFILE, and NOT via the PM variable the install step detects into:
            # shell state does not cross Actions steps, so reading it here is an unbound-variable
            # abort under set -u — i.e. every Astro build fails. Same if-chain as build.sh.
            # A prune failure ships the full tree rather than no site.
            if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --production
            elif [ -f pnpm-lock.yaml ]; then pnpm prune --prod
            elif [ -f yarn.lock ]; then yarn install --production
            else npm prune --omit=dev
            fi || echo "prune failed — shipping the full node_modules"
            cp -al node_modules "$RT/app/node_modules" 2>/dev/null || cp -a node_modules "$RT/app/node_modules"
            # Hashed client assets to the web root, so nginx serves them off disk under its
            # 1y-immutable rule and the Node process never sees an asset request.
            cp -al dist/client/. "$RT/" 2>/dev/null || cp -a dist/client/. "$RT/"
            printf '%s\n' '{"kind":"node","dir":"app","entry":"server/entry.mjs"}' > "$RT/bcms-runtime.json"
            BUILD_DIR="$RT"
          fi
          if [ -z "$BUILD_DIR" ]; then
            echo "::error::no static HTML found in the repo or any build output (searched: $CANDIDATES, plus the repo root), and no server build either. For a plain static site, commit an index.html. For a framework, either produce a static export (Next.js: output:'export' + images.unoptimized:true in next.config; on Next.js 16+ build with 'next build --webpack' since the default Turbopack build skips static export) or run it as a server app (Next.js: output:'standalone' in next.config; Astro: output:'server' with @astrojs/node in mode:'standalone' — then switch this project to 'Run as a server app' on the Hosting page). Or set the BCMS_BUILD_DIR repository variable to point at your output directory."; exit 1
          fi
          echo "packaging build dir: $BUILD_DIR"
          TARBALL="$RUNNER_TEMP/bcms-artifact.tgz"
          # Exclude repo metadata + our injected content file. Harmless no-ops when
          # packaging a clean build dir (e.g. dist/), needed when packaging the repo root.
          # The node_modules exclude is anchored to the archive ROOT (./node_modules), so a
          # runtime release keeps its own ./app/node_modules — without which the packaged app
          # (an Astro server build ships one; a Next standalone bundle builds its own) is an
          # entrypoint with nothing to require.
          cp "$RUNNER_TEMP/bcms-design-system.json" "$BUILD_DIR/bcms-design-system.json"
          tar --exclude=./.git --exclude=./.github --exclude=./node_modules --exclude=./bcms-content.json -czf "$TARBALL" -C "$BUILD_DIR" .
          CHECKSUM="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$TARBALL")"
          DURATION="$(( $(date +%s) - ${BCMS_STARTED_AT:-$(date +%s)} ))"
          echo "artifact: $SIZE bytes, sha256:$CHECKSUM, built in ${DURATION}s"
          # Upload STRAIGHT to R2 via a presigned PUT, then hand the API the staged key.
          # Posting the tarball through the API means posting it through Cloudflare, whose
          # ~100 MB edge cap rejects the request before it reaches the backend — the runner
          # gets an HTML "413 Payload Too Large" with a cloudflare footer, and nothing is
          # logged server-side because nothing arrived. A static build clears 100 MB easily.
          # (Same two-step the agent deploy lane already uses.)
          UP="$(curl -sS -X POST "$API_URL/api/v1/projects/$PROJECT_ID/artifacts/upload-url" \
            -H "Authorization: Bearer $API_KEY" -H "Content-Length: 0")"
          UPLOAD_URL="$(printf '%s' "$UP" | jq -r '.uploadUrl // empty')"
          UPLOAD_KEY="$(printf '%s' "$UP" | jq -r '.uploadKey // empty')"

          if [ -n "$UPLOAD_URL" ] && [ -n "$UPLOAD_KEY" ]; then
            PUT_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              -H "Content-Type: application/gzip" --upload-file "$TARBALL" "$UPLOAD_URL")"
            if [ "$PUT_STATUS" != "200" ] && [ "$PUT_STATUS" != "201" ]; then
              echo "::error::artifact upload to storage failed (HTTP $PUT_STATUS)"; exit 1
            fi
            STATUS="$(curl -sS -o "$RUNNER_TEMP/ingest-resp.json" -w '%{http_code}' \
              -X POST "$API_URL/api/v1/projects/$PROJECT_ID/artifacts/from-upload" \
              -H "Authorization: Bearer $API_KEY" \
              -H "X-Artifact-Sha: $SHA" \
              -H "X-Artifact-Checksum: sha256:$CHECKSUM" \
              -H "X-Artifact-Size: $SIZE" \
              -H "X-Artifact-Branch: $BRANCH" \
              -H "X-Artifact-Author: $AUTHOR" \
              -H "X-Artifact-Duration: $DURATION" \
              -H "X-Artifact-Run-Id: $RUN_ID" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg k "$UPLOAD_KEY" '{uploadKey:$k}')")"
          else
            # An older backend has no /upload-url. Fall back to the raw body so a repo on
            # the current workflow keeps deploying against an API that predates this.
            echo "staged upload unavailable — posting the artifact directly"
            STATUS="$(curl -sS -o "$RUNNER_TEMP/ingest-resp.json" -w '%{http_code}' \
              -X POST "$API_URL/api/v1/projects/$PROJECT_ID/artifacts" \
              -H "Authorization: Bearer $API_KEY" \
              -H "X-Artifact-Sha: $SHA" \
              -H "X-Artifact-Checksum: sha256:$CHECKSUM" \
              -H "X-Artifact-Branch: $BRANCH" \
              -H "X-Artifact-Author: $AUTHOR" \
              -H "X-Artifact-Duration: $DURATION" \
              -H "X-Artifact-Run-Id: $RUN_ID" \
              -H "Content-Type: application/gzip" \
              -H "Content-Length: $SIZE" \
              --data-binary @"$TARBALL")"
          fi
          echo "ingest HTTP $STATUS:"; cat "$RUNNER_TEMP/ingest-resp.json"; echo
          if [ "$STATUS" != "202" ]; then
            echo "::error::artifact ingest failed (HTTP $STATUS)"; exit 1
          fi

      # Closes the feedback loop: without this a failed build is invisible to BetterCMS,
      # which can only wait ~10 min, re-dispatch the same doomed build, and eventually say
      # "check your GitHub Action". Now the deploy timeline shows the real error in seconds.
      - name: Report build failure to BetterCMS
        if: failure()
        env:
          API_URL: https://api.bettercms.ai
          API_KEY: ${{ secrets.BCMS_API_KEY }}
          PROJECT_ID: ${{ vars.BCMS_PROJECT_ID }}
          BRANCH: main
          AUTHOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Best-effort by construction: this step must never mask the real failure, so
          # every command tolerates absence and the upload itself ends in "|| true".
          SHA="$(git rev-parse HEAD 2>/dev/null || echo '')"
          DURATION="$(( $(date +%s) - ${BCMS_STARTED_AT:-$(date +%s)} ))"
          # jq (preinstalled on ubuntu-latest) does the JSON escaping — a build log is
          # arbitrary text and must never be hand-quoted into a payload.
          tail -c 16000 "$RUNNER_TEMP/bcms-build.log" 2>/dev/null \
            | jq -Rs --arg sha "$SHA" --arg runId "$RUN_ID" --arg branch "$BRANCH" \
                     --arg author "$AUTHOR" --argjson duration "$DURATION" \
                 '{sha:$sha, runId:$runId, branch:$branch, author:$author, durationSec:$duration, log:.}' \
            > "$RUNNER_TEMP/bcms-failure.json"
          curl -sS -o /dev/null -X POST "$API_URL/api/v1/projects/$PROJECT_ID/build-status" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/bcms-failure.json" || true
